# Keeps the pipeline and the Python packages up to date by opening pull requests
# (at most one batch a month, so it stays quiet).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "ci" }
  - package-ecosystem: pip
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: "build" }
    groups:
      python-packages: { patterns: ["*"] }
