# Builds the standalone Linux app (x86_64): a .tar.gz with a Tippy folder; run ./Tippy/Tippy inside it.
# docs/REVAMP_BRIEF.md section 4.6: "Produce a Windows .exe first; add macOS and Linux after." See docs/BUILD.md.
#   - On a version tag (v0.11.0) the file is added to the DRAFT release that release.yml creates.
#   - By hand (Actions tab, "Run workflow") or in a pull request that touches the packaging: a test build,
#     with the file kept for 14 days under the run's "Artifacts".
# The app opens Tippy in Chrome or Chromium in kiosk mode when one is installed, otherwise in the normal browser.
name: Linux app

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - "packaging/**"
      - "scripts/launch.py"
      - "backend/config.py"
      - "requirements*.txt"
      - ".github/workflows/linux-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Linux app (x86_64)
    runs-on: ubuntu-22.04        # an older base system, so the app also runs on older Linux versions
    timeout-minutes: 20
    permissions:
      contents: write        # needed to add the file to the release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install
        run: pip install -r requirements.txt -r requirements-build.txt
      - name: Version
        run: echo "TIPPY_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
      - name: Build the app (PyInstaller)
        run: pyinstaller --noconfirm --clean --distpath dist --workpath build packaging/tippy.spec
      - name: Test the app
        run: packaging/smoke_mac.sh dist/Tippy/Tippy        # plain bash and curl: the same check works on Linux

      - name: Pack it and write a checksum
        run: |
          cd dist
          FILE="Tippy-$TIPPY_VERSION-linux-x86_64.tar.gz"
          tar -czf "$FILE" Tippy
          sha256sum "$FILE" > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - uses: actions/upload-artifact@v7
        with:
          name: tippy-linux-${{ env.TIPPY_VERSION }}
          path: |
            dist/Tippy-*-linux-*.tar.gz
            dist/SHA256SUMS-linux.txt
          retention-days: 14

      - name: Add to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # release.yml creates the draft; wait for it (up to 15 minutes).
          for i in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && break
            echo "Waiting for the draft release..."; sleep 30
          done
          gh release upload "$GITHUB_REF_NAME" "dist/Tippy-$TIPPY_VERSION-linux-x86_64.tar.gz" dist/SHA256SUMS-linux.txt --clobber
