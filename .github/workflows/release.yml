# Release pipeline. Push a tag like v0.9.1 and this workflow will:
#   1. check the tag matches the VERSION file and points at a commit on main,
#   2. run all checks (scripts/check.sh),
#   3. build Tippy-<version>.zip and check its contents,
#   4. create a DRAFT GitHub release with the zip and a checksum file.
# Nothing is public until you open the draft on GitHub and click "Publish release".
# Run it by hand from the Actions tab for a dry run: it builds everything but publishes nothing.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # needed to create the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Tag must match VERSION and be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file (v$version). Update VERSION in a pull request first."; exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "The tagged commit is not on main."; exit 1; }

      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run all checks
        run: scripts/check.sh
      - name: Build the zip
        run: python scripts/make_zip.py
      - name: Check the zip contents
        run: scripts/check_zip.sh
      - name: Checksums and release notes
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          sha256sum "Tippy-$version.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt
          scripts/release_notes.sh "$version" > release-notes.md
          echo "version=$version" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: tippy-release-${{ env.version }}
          path: |
            Tippy-*.zip
            SHA256SUMS.txt
            release-notes.md
          retention-days: 30

      - name: Create the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Versions below 1.0.0 are marked as pre-releases.
          flags=""; case "$version" in 0.*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "Tippy-$version.zip" SHA256SUMS.txt \
            --draft $flags --verify-tag --title "Tippy $version" --notes-file release-notes.md
          echo "Draft release created. Open it on GitHub and click Publish when you are ready." >> "$GITHUB_STEP_SUMMARY"
