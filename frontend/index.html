<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tippy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Persistent Home button (hidden on the welcome screen) -->
  <button id="home-btn" class="big-btn round" aria-label="Home" hidden>🏠</button>
  <button id="back-btn" class="big-btn round" aria-label="Back" hidden>
    <svg viewBox="0 0 48 48" width="44" height="44" aria-hidden="true"><path d="M30 8 L14 24 L30 40" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <!-- Quick mute for the child (sound and voice) -->
  <button id="mute-btn" aria-label="Mute" title="Mute">🔊</button>
  <!-- Who is playing? Only shown on the welcome and map screens when there are several children -->
  <button id="who-btn" class="big-btn round" aria-label="Who is playing?" hidden>🦊</button>
  <!-- Small, unobtrusive parent icon -->
  <button id="parent-btn" aria-label="Parent area">⚙️</button>

  <!-- The app draws its screens into this element -->
  <main id="screen"></main>

  <!-- Speech bubble from the mascot, shown on every screen -->
  <div id="modal-root"></div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/i18n-es.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/mouse.js"></script>
  <script src="js/keyboard.js"></script>
  <script src="js/kingdom.js"></script>
  <script src="js/letters.js"></script>
  <script src="js/typing.js"></script>
  <script src="js/numbers.js"></script>
  <script src="js/words.js"></script>
  <script src="js/sentences.js"></script>
  <script src="js/basics.js"></script>
  <script src="js/freeplay.js"></script>
  <script src="js/paint.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/internet.js"></script>
  <script src="js/robot.js"></script>
  <script src="js/limits.js"></script>
  <script src="js/ask.js"></script>
  <script src="js/profiles.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
