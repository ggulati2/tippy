[pytest]
# The browser tests take a few minutes and need Chrome, so they are skipped unless asked for:
#   python -m pytest -m browser      (and -m perf for the speed measurements)
addopts = -m "not browser and not perf"
markers =
    browser: plays the real app in headless Chrome (slow; needs Chrome)
    perf: measures speed and memory in real time with Playwright (needs requirements-perf.txt and Chrome)
